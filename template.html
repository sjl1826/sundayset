<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunday Worship Set</title>
<style>
  :root {
    --bg: #f6f9fc;
    --panel: #ffffff;
    --ink: #0a1b2a;
    --muted: #5b7186;
    --line: #e6ecf2;
    --accent: #4da2ff;
    --accent-dark: #011829;
    --accent-soft: #eaf4ff;
    --radius: 20px;
    --shadow: 0 1px 2px rgba(10,27,42,.04), 0 12px 40px rgba(10,27,42,.06);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -200px, #eaf4ff 0%, rgba(234,244,255,0) 60%),
      var(--bg);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 56px 28px 96px;
  }

  /* ---------- Header ---------- */
  header.hero {
    text-align: center;
    margin-bottom: 56px;
  }
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #d5e9ff;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 22px;
  }
  /* Glowing, hue-shifting aura behind the title */
  .title-wrap {
    position: relative;
    display: inline-block;
    isolation: isolate;
  }
  .title-wrap::before {
    content: "";
    position: absolute;
    inset: -55% -25%;
    z-index: -1;
    background: conic-gradient(from 0deg,
      #4da2ff, #a78bfa, #f472b6, #fbbf24, #38bdf8, #4da2ff);
    filter: blur(55px);
    opacity: .5;
    border-radius: 50%;
    animation: aura-spin 9s linear infinite;
  }
  @keyframes aura-spin { to { transform: rotate(360deg); } }

  h1.band-name {
    position: relative;
    font-size: clamp(40px, 8vw, 76px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    font-weight: 800;
    margin: 0 0 12px;
    /* light sweeping across the letters */
    background: linear-gradient(100deg,
      #0a1b2a 0%, #22557f 30%, #4da2ff 45%, #ffffff 50%, #4da2ff 55%, #22557f 70%, #0a1b2a 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 34px rgba(77, 162, 255, .35));
    animation: title-shine 6s linear infinite;
  }
  @keyframes title-shine {
    to { background-position: 260% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .title-wrap::before { animation: none; }
    h1.band-name { animation: none; }
  }
  .date {
    font-size: 18px;
    color: var(--muted);
    font-weight: 500;
  }
  [contenteditable]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 8px;
  }

  /* ---------- Section titles ---------- */
  .section-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 20px;
  }

  /* ---------- Members ---------- */
  .members {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
    margin-bottom: 64px;
  }
  /* 4 across by default; a 7-person lineup reads better as 3 then 4 */
  .member { grid-column: span 3; }
  .members[data-count="7"] .member:nth-child(-n + 3) { grid-column: span 4; }
  .member {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .photo {
    width: 92px;
    height: 92px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(160deg, #eaf4ff, #d5e9ff);
    background-size: cover;
    background-position: center;
    border: 1px solid #d5e9ff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .photo .hint { padding: 0 8px; }
  .member .name {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .member .role {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }
  .member .role .icon { font-size: 15px; }

  /* ---------- Table of contents ---------- */
  .toc {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 28px;
    box-shadow: var(--shadow);
    margin-bottom: 64px;
  }
  .toc ol {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: toc;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 6px 24px;
  }
  .toc li { counter-increment: toc; }
  .toc a {
    display: flex;
    align-items: baseline;
    gap: 12px;
    text-decoration: none;
    color: var(--ink);
    padding: 10px 8px;
    border-radius: 10px;
    border-bottom: 1px solid var(--line);
    transition: background .15s;
  }
  .toc a:hover { background: var(--accent-soft); }
  .toc a::before {
    content: counter(toc, decimal-leading-zero);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent);
    font-size: 13px;
    min-width: 24px;
  }
  .toc-title { margin-right: auto; }
  .toc .toc-key,
  .toc .toc-singer {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .toc .toc-key { color: var(--muted); }
  .toc .toc-singer { color: var(--accent); }
  .toc-subhead {
    margin: 18px 0 4px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Songs ---------- */
  .songs { display: grid; gap: 24px; }
  .song {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    scroll-margin-top: 24px;
  }
  .song-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 26px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .song-num {
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #d5e9ff;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  .song-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }
  a.song-title:hover { border-bottom-color: var(--accent); color: var(--accent); }
  .song-title-link { display: inline-flex; align-items: center; gap: 8px; }
  .link-btn {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 8px;
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    flex: none;
  }
  .link-btn:hover { border-color: var(--accent); color: var(--accent); }
  .song-meta {
    margin-left: auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: #f2f6fa;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
  }
  .chip .label {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: 11px;
  }
  .chip .val { min-width: 20px; }

  .chords-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 18px 26px 0;
  }
  .chords {
    font-family: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    padding: 12px 26px 26px;
    color: #142a3d;
    min-height: 90px;
  }
  .chords:empty::before {
    content: "Paste your chords / lyrics here…";
    color: #a9b8c6;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 50;
  }

  /* ---------- Date picker ---------- */
  .datebar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 40px;
  }
  .datebar label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .datebar select {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .datebar select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: transform .12s, background .15s;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn.primary {
    background: var(--accent-dark);
    color: #fff;
    border-color: var(--accent-dark);
  }
  .btn.primary:hover { background: #0a2740; }

  .footnote {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 56px;
  }

  /* ---------- Print / PDF ---------- */
  /* ---------- Auto-scroll controller ---------- */
  .scroller {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 10px 12px;
    user-select: none;
    -webkit-user-select: none;
  }
  .scroller .grip {
    cursor: grab;
    color: #b9c6d3;
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
    touch-action: none;
  }
  .scroller.dragging .grip { cursor: grabbing; }
  .scroller .play {
    border: none;
    background: var(--accent-dark);
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scroller .play.on { background: var(--accent); }
  .scroller .speed-wrap { display: flex; flex-direction: column; align-items: center; }
  .scroller .speed-row { display: flex; align-items: center; gap: 5px; }
  .scroller .stepper {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    width: 36px;
    height: 40px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scroller .stepper:hover { background: var(--accent-soft); }
  .scroller .stepper:active { background: var(--accent); color: #fff; }
  .scroller .speed {
    width: 48px;
    text-align: center;
    font-family: var(--font);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 4px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .scroller .speed:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .scroller .speed::-webkit-outer-spin-button,
  .scroller .speed::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .scroller .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ---------- Profile modal ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(10, 27, 42, .45);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .modal.open { display: flex; }
  .modal-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(10, 27, 42, .25);
    padding: 44px 48px 40px;
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  .modal-photo {
    width: clamp(160px, 55vw, 240px);
    height: clamp(160px, 55vw, 240px);
    margin: 0 auto 24px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    background-color: var(--accent-soft);
    border: 1px solid #d5e9ff;
  }
  .modal-name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .modal-role {
    margin-top: 8px;
    font-size: 17px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .modal-role .icon { font-size: 19px; }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 18px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    color: var(--muted);
  }
  .modal-close:hover { color: var(--ink); }

  /* ---------- Opening explosion ---------- */
  #explosion {
    position: fixed;
    inset: 0;
    z-index: 200;
    pointer-events: none;
    overflow: hidden;
  }
  .boom {
    position: fixed;
    top: 0;
    left: 0;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
    animation: boom var(--dur) cubic-bezier(.15, .75, .25, 1) forwards;
  }
  @keyframes boom {
    0%   { transform: translate(var(--ox), var(--oy)) scale(.3); opacity: 1; }
    100% { transform: translate(calc(var(--ox) + var(--tx)), calc(var(--oy) + var(--ty))) scale(1); opacity: 0; }
  }

  /* ---------- Mobile / phone ---------- */
  @media (max-width: 680px) {
    .wrap { padding: 32px 16px 90px; }
    .toolbar { top: 10px; right: 10px; }
    .btn { padding: 6px 11px; font-size: 12px; border-radius: 9px; }
    .datebar { margin-bottom: 30px; flex-wrap: wrap; }
    /* 2 per row on phones, whatever the lineup size */
    .members { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .members .member { grid-column: auto !important; }
    .photo { width: 78px; height: 78px; }
    .toc { padding: 18px 16px; }
    .toc ol { grid-template-columns: 1fr; }
    .section-title { margin-bottom: 14px; }
    .song-head { padding: 16px; gap: 12px; }
    .song-title { font-size: 20px; }
    .song-meta { margin-left: 0; width: 100%; }
    .chords-label { padding: 16px 16px 0; }
    .chords { font-size: 12.5px; padding: 12px 16px 22px; }
    .modal-card { padding: 34px 22px 28px; }
    .scroller { right: 10px; bottom: 10px; }
  }

  @media print {
    :root { --shadow: none; }
    /* Force photos and colored chips to actually print (no "Background graphics" checkbox needed) */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { background: #fff; }
    .toolbar { display: none !important; }
    .datebar { display: none !important; }
    .scroller { display: none !important; }
    .modal { display: none !important; }
    #explosion { display: none !important; }
    /* Solid, static title for a clean PDF */
    .title-wrap::before { display: none !important; }
    h1.band-name { animation: none !important; filter: none !important; -webkit-text-fill-color: #0a1b2a; color: #0a1b2a; background: none; }
    .wrap { padding: 0; max-width: 100%; }
    .photo .hint { display: none; }
    .member, .toc, .song { break-inside: avoid; box-shadow: none; }
    .song { break-inside: avoid-page; }
    a { color: inherit; text-decoration: none; }
    .link-btn { display: none !important; }
    [contenteditable]:focus { outline: none; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn primary" onclick="window.print()">Export to PDF</button>
</div>

<div class="wrap">

  <!-- SETLIST PICKER -->
  <div class="datebar">
    <label for="setPicker">Set list</label>
    <select id="setPicker"></select>
  </div>

  <!-- HERO -->
  <header class="hero">
    <div class="title-wrap">
      <h1 class="band-name" contenteditable="true" data-save="band-name">Our Band Name</h1>
    </div>
    <div class="date" contenteditable="true" data-save="date">Friday · July 2, 2026</div>
  </header>

  <!-- MEMBERS -->
  <p class="section-title">The Band</p>
  <div class="members" id="members"></div>

  <!-- TABLE OF CONTENTS -->
  <p class="section-title">Setlist · Table of Contents</p>
  <nav class="toc">
    <ol id="toc"></ol>
    <p class="toc-subhead">Extra Songs</p>
    <ol id="toc-extra"></ol>
  </nav>

  <!-- SONGS -->
  <p class="section-title">Songs</p>
  <div class="songs" id="songs"></div>

  <!-- EXTRA SONGS -->
  <p class="section-title">Extra Songs</p>
  <div class="songs" id="extra-songs"></div>

  <p class="footnote">Click any text to edit it · Click a photo circle to add a picture · Click 🔗 to set a song link · then “Export to PDF”.</p>
</div>

<!-- Profile modal: bigger view of a band member -->
<div class="modal" id="profileModal">
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-photo" id="modalPhoto"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-role" id="modalRole"></div>
  </div>
</div>

<script>
  /* ---------------- Data ---------------- */
  /* The lineup a set falls back to when its own roster is missing. Each set in
     PROJECT_SETS may carry a `roster` of { name, role, icon, photo } instead. */
  const DEFAULT_ROSTER = [
    { name: "Joanne",  role: "Keyboard / Vox",        icon: "🎹" },
    { name: "Sam",     role: "Acoustic Guitar / Vox", icon: "🎸" },
    { name: "Ana",     role: "Vox",                   icon: "🎤" },
    { name: "Abraham", role: "Vox",                   icon: "🎤" },
    { name: "Edwin",   role: "Bass Guitar",           icon: "🎸" },
    { name: "Gabe",    role: "Drums",                 icon: "🥁" },

  const membersEl = document.getElementById("members");

  /* Photos arrive as a bare path, a data URI, or already wrapped by an older save. */
  function cssUrl(photo) {
    return /^url\(/i.test(photo) ? photo : `url('${photo}')`;
  }

  function memberCard(member, idx) {
    const photo = member.photo || PHOTOS[member.name] || "";
    const background = photo ? ` style="background-image:${cssUrl(photo)}"` : "";
    const hint = photo ? "" : '<span class="hint">Add photo</span>';
    const card = document.createElement("div");
    card.className = "member";
    card.innerHTML = `
      <div class="photo" data-idx="${idx}" title="Click to view profile"${background}>${hint}</div>
      <div class="name" contenteditable="true" data-save="m-name-${idx}">${member.name}</div>
      <div class="role"><span class="icon">${member.icon}</span><span contenteditable="true" data-save="m-role-${idx}">${member.role}</span></div>
    `;
    return card;
  }

  /* The roster is re-rendered per set, so lineups of different sizes can coexist. */
  function renderRoster(roster) {
    membersEl.replaceChildren(...roster.map(memberCard));
    membersEl.dataset.count = roster.length;
  }

  renderRoster(DEFAULT_ROSTER);

  /* ---------------- Songs + TOC ---------------- */
  const songsEl = document.getElementById("songs");
  const tocEl = document.getElementById("toc");
  const extraSongsEl = document.getElementById("extra-songs");
  const extraTocEl = document.getElementById("toc-extra");
  const pad = (n) => String(n).padStart(2, "0");

  function buildSong(i, displayNum, songsContainer, tocContainer) {
    const id = "song-" + i;

    // TOC entry
    const li = document.createElement("li");
    li.innerHTML = `
      <a href="#${id}">
        <span class="toc-title" data-song="${i}">Song ${i}</span>
        <span class="toc-key" data-key="${i}">—</span>
        <span class="toc-singer" data-singer="${i}"></span>
      </a>`;
    tocContainer.appendChild(li);

    // Song card
    const song = document.createElement("section");
    song.className = "song";
    song.id = id;
    song.innerHTML = `
      <div class="song-head">
        <div class="song-num">${pad(displayNum)}</div>
        <div class="song-title-link">
          <a class="song-title" href="#" target="_blank" rel="noopener" data-title="${i}" data-save="song-title-${i}" contenteditable="true"
             onclick="if(this.getAttribute('href')==='#'){return false;}">Song Title ${i}</a>
          <button class="link-btn" title="Set link" onclick="setLink(${i})">🔗</button>
        </div>
        <div class="song-meta">
          <span class="chip"><span class="label">Key</span><span class="val" contenteditable="true" data-keyval="${i}" data-save="song-key-${i}">C</span></span>
          <span class="chip"><span class="label">Singer</span><span class="val" contenteditable="true" data-save="song-singer-${i}">Name</span></span>
        </div>
      </div>
      <div class="chords-label">Chords / Lyrics</div>
      <div class="chords" contenteditable="true" data-save="song-chords-${i}"></div>
    `;
    songsContainer.appendChild(song);
  }

  for (let i = 1; i <= SONG_COUNT; i++) buildSong(i, i, songsEl, tocEl);
  for (let k = 1; k <= EXTRA_COUNT; k++) buildSong(SONG_COUNT + k, k, extraSongsEl, extraTocEl);

  /* ---------------- Sync TOC with song titles, key, singer ---------------- */
  function syncToc() {
    for (let i = 1; i <= TOTAL_SONGS; i++) {
      const title = document.querySelector(`[data-title="${i}"]`).textContent.trim();
      const key = document.querySelector(`[data-keyval="${i}"]`).textContent.trim();
      const singer = document.querySelector(`[data-save="song-singer-${i}"]`).textContent.trim();
      document.querySelector(`[data-song="${i}"]`).textContent = title || ("Song " + i);
      document.querySelector(`[data-key="${i}"]`).textContent = key ? ("Key of " + key) : "—";
      document.querySelector(`[data-singer="${i}"]`).textContent = singer && singer !== "Name" ? singer : "";
    }
  }
  document.addEventListener("input", syncToc);
  syncToc();

  /* ---------------- State helpers (used by the set picker) ---------------- */
  /* Member names and roles come from the set's roster, never from `text`, so each
     set owns its lineup and the blank baseline below stays songs-only. */
  const MEMBER_FIELD = /^m-(name|role)-\d+$/;

  function collectState() {
    const s = { text: {}, links: {} };
    document.querySelectorAll("[data-save]").forEach((el) => {
      if (!MEMBER_FIELD.test(el.dataset.save)) s.text[el.dataset.save] = el.innerHTML;
    });
    document.querySelectorAll("a.song-title[data-title]").forEach((a) => { s.links[a.dataset.title] = a.getAttribute("href"); });
    return s;
  }

  function applyState(s) {
    if (!s) return;
    if (s.text) Object.entries(s.text).forEach(([k, v]) => {
      const el = document.querySelector(`[data-save="${k}"]`);
      if (el) el.innerHTML = v;
    });
    if (s.photos) Object.entries(s.photos).forEach(([k, v]) => {
      const el = document.querySelector(`.photo[data-idx="${k}"]`);
      if (el && v) { el.style.backgroundImage = cssUrl(v); const h = el.querySelector(".hint"); if (h) h.style.display = "none"; }
    });
    if (s.links) Object.entries(s.links).forEach(([k, v]) => {
      const a = document.querySelector(`a.song-title[data-title="${k}"]`);
      if (a && v) { a.setAttribute("href", v); if (v !== "#") a.title = "Opens: " + v; }
    });
    syncToc();
  }

  /* ---------------- Set list picker: choose a stored set to load ---------------- */
  const SETS = window.PROJECT_SETS || {};   // { "<id>": savedState }, baked in at build time
  const BLANK_SET = collectState();          // pristine song fields to reset to between sets
  const picker = document.getElementById("setPicker");

  function labelForSet(set) {
    const t = (set && set.text) || {};
    return t["date"] || t["band-name"] || "Set list";
  }

  function loadSet(key) {
    const set = SETS[key];
    renderRoster((set && set.roster) || DEFAULT_ROSTER);
    applyState(BLANK_SET);                  // reset first so nothing lingers from another set
    if (set) applyState(set);
  }

  Object.keys(SETS).forEach((key) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = labelForSet(SETS[key]);
    picker.appendChild(opt);
  });
  picker.addEventListener("change", () => loadSet(picker.value));

  const startKey = window.DEFAULT_DATE || Object.keys(SETS)[0] || "";
  if (startKey) { picker.value = startKey; loadSet(startKey); }

  /* ---------------- Set song link ---------------- */
  function setLink(i) {
    const a = document.querySelector(`[data-title="${i}"]`);
    const current = a.getAttribute("href") === "#" ? "" : a.getAttribute("href");
    const url = prompt("Paste the link for this song (YouTube, Spotify, chart, etc.):", current);
    if (url === null) return;
    if (url.trim() === "") { a.setAttribute("href", "#"); return; }
    a.setAttribute("href", url.trim());
    a.title = "Opens: " + url.trim();
  }

  /* ---------------- Profile modal: click a photo to view it bigger ---------------- */
  const modal = document.getElementById("profileModal");
  const modalPhoto = document.getElementById("modalPhoto");
  const modalName = document.getElementById("modalName");
  const modalRole = document.getElementById("modalRole");

  function openProfile(card) {
    const photo = card.querySelector(".photo");
    modalPhoto.style.backgroundImage = photo ? photo.style.backgroundImage : "";
    modalName.textContent = card.querySelector(".name").textContent;
    modalRole.innerHTML = card.querySelector(".role").innerHTML;
    modal.classList.add("open");
  }
  function closeProfile() { modal.classList.remove("open"); }

  document.addEventListener("click", (e) => {
    const photo = e.target.closest(".photo");
    if (photo) {
      const card = photo.closest(".member");
      if (card) openProfile(card);
    }
  });
  modal.addEventListener("click", (e) => { if (e.target === modal) closeProfile(); });
  document.getElementById("modalClose").addEventListener("click", closeProfile);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProfile(); });
</script>

<!-- Auto-scroll controller: draggable, stays in the corner, wheel sets speed -->
<div class="scroller" id="scroller" title="Set the speed, then press play · drag ⠿ to move">
  <span class="grip" id="scrollerGrip" title="Drag to move">⠿</span>
  <button class="play" id="scrollPlay" title="Start / stop auto-scroll" aria-label="Start or stop auto-scroll">▶</button>
  <div class="speed-wrap">
    <div class="speed-row">
      <button class="stepper" id="speedDown" aria-label="Slower">−</button>
      <input class="speed" id="scrollSpeed" type="number" inputmode="numeric" min="1" max="300" step="1" value="6"
             title="Speed (1 = super slow). Tap − / + or scroll the wheel to change." />
      <button class="stepper" id="speedUp" aria-label="Faster">+</button>
    </div>
    <span class="lbl">speed</span>
  </div>
</div>

<script>
  (function () {
    const panel  = document.getElementById("scroller");
    const grip   = document.getElementById("scrollerGrip");
    const play   = document.getElementById("scrollPlay");
    const speed  = document.getElementById("scrollSpeed");

    const MIN = 1, MAX = 300;               // pixels per second (1 = super slow)
    let running = false, rafId = null, lastTs = 0, pos = 0;

    // The scrolling element (bypassing scrollBy avoids CSS scroll-behavior: smooth,
    // which otherwise animates every step and cripples the speed on mobile).
    const scroller = document.scrollingElement || document.documentElement;

    function clampSpeed() {
      let v = parseFloat(speed.value);
      if (isNaN(v)) v = MIN;
      v = Math.max(MIN, Math.min(MAX, Math.round(v)));
      speed.value = v;
      return v;
    }

    function maxScroll() {
      return document.documentElement.scrollHeight - window.innerHeight;
    }

    function frame(ts) {
      if (!running) return;
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      pos += clampSpeed() * dt;                 // float accumulator → smooth even at 1 px/s
      scroller.scrollTop = pos;                 // direct assignment = instant scroll (not smoothed)
      if (pos >= maxScroll()) { stop(); return; }
      rafId = requestAnimationFrame(frame);
    }

    function start() {
      pos = scroller.scrollTop;
      if (pos >= maxScroll() - 1) { pos = 0; scroller.scrollTop = 0; }
      running = true; lastTs = 0;
      play.textContent = "⏸"; play.classList.add("on");
      rafId = requestAnimationFrame(frame);
    }
    function stop() {
      running = false;
      play.textContent = "▶"; play.classList.remove("on");
      if (rafId) cancelAnimationFrame(rafId);
    }
    play.addEventListener("click", () => (running ? stop() : start()));

    // Mouse wheel over the number box adjusts speed instead of scrolling the page
    speed.addEventListener("wheel", (e) => {
      e.preventDefault();
      speed.value = (parseFloat(speed.value) || MIN) + (e.deltaY < 0 ? 1 : -1);
      clampSpeed();
    }, { passive: false });
    speed.addEventListener("change", clampSpeed);

    // + / − buttons (works great on touch screens)
    function bump(delta) { speed.value = (parseFloat(speed.value) || MIN) + delta; clampSpeed(); }
    document.getElementById("speedDown").addEventListener("click", () => bump(-1));
    document.getElementById("speedUp").addEventListener("click", () => bump(1));

    // Draggable — position:fixed keeps it pinned on screen wherever you scroll
    let dragging = false, offX = 0, offY = 0;
    function pt(e) { return e.touches ? e.touches[0] : e; }
    function down(e) {
      dragging = true; panel.classList.add("dragging");
      const r = panel.getBoundingClientRect(), p = pt(e);
      offX = p.clientX - r.left; offY = p.clientY - r.top;
      panel.style.right = "auto"; panel.style.bottom = "auto";
      panel.style.left = r.left + "px"; panel.style.top = r.top + "px";
      e.preventDefault();
    }
    function move(e) {
      if (!dragging) return;
      const p = pt(e);
      let x = p.clientX - offX, y = p.clientY - offY;
      x = Math.max(4, Math.min(window.innerWidth  - panel.offsetWidth  - 4, x));
      y = Math.max(4, Math.min(window.innerHeight - panel.offsetHeight - 4, y));
      panel.style.left = x + "px"; panel.style.top = y + "px";
    }
    function up() { dragging = false; panel.classList.remove("dragging"); }
    grip.addEventListener("mousedown", down);
    grip.addEventListener("touchstart", down, { passive: false });
    document.addEventListener("mousemove", move);
    document.addEventListener("touchmove", move, { passive: false });
    document.addEventListener("mouseup", up);
    document.addEventListener("touchend", up);
  })();

  /* ---------------- Opening explosion ---------------- */
  (function () {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const title = document.querySelector(".band-name");
    const rect = title
      ? title.getBoundingClientRect()
      : { left: window.innerWidth / 2, top: window.innerHeight / 3, width: 0, height: 0 };
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const colors = ["#4da2ff", "#a78bfa", "#f472b6", "#fbbf24", "#38bdf8", "#34d399", "#ffffff"];

    const layer = document.createElement("div");
    layer.id = "explosion";
    document.body.appendChild(layer);

    const N = 48;
    for (let i = 0; i < N; i++) {
      const p = document.createElement("span");
      p.className = "boom";
      const angle = (Math.PI * 2 * i) / N + (i % 3) * 0.16;
      const dist = 150 + ((i * 53) % 280);      // varied spread
      const size = 8 + ((i * 13) % 12);
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--ox", ox + "px");
      p.style.setProperty("--oy", oy + "px");
      p.style.setProperty("--tx", (Math.cos(angle) * dist) + "px");
      p.style.setProperty("--ty", (Math.sin(angle) * dist + dist * 0.15) + "px");
      p.style.setProperty("--dur", (0.9 + (i % 7) * 0.09).toFixed(2) + "s");
      layer.appendChild(p);
    }
    setTimeout(() => layer.remove(), 1900);
  })();
</script>
</body>
</html>
