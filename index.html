      placePanel(box.left, box.top);
      grip.setPointerCapture(e.pointerId);
      e.preventDefault();                      // no text selection, no page scroll
    });

    grip.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      placePanel(e.clientX - offX, e.clientY - offY);
      e.preventDefault();
    });

    const endDrag = () => { dragging = false; panel.classList.remove("dragging"); };
    grip.addEventListener("pointerup", endDrag);
    grip.addEventListener("pointercancel", endDrag);

    /* Rotating the phone can leave a dragged panel off-screen; pull it back. */
    window.addEventListener("resize", () => {
      if (panel.style.left) placePanel(parseFloat(panel.style.left), parseFloat(panel.style.top));
    });
  })();

  /* ---------------- Stage mode: dark theme + chord size ---------------- */
  /* Both are personal and local: the doc says what to play, this says how to read it. */
  (function () {
    const STORAGE_KEY = "setlist-display";
    const CHORD_SIZES = [12, 14, 16, 19, 22, 26];        // desktop px, per step
    const PHONE_SIZES = [11, 12.5, 14.5, 17, 20, 24];    // the same steps on a phone
    const DEFAULT_STEP = 1;
    const root = document.documentElement;
    const themeButton = document.getElementById("themeToggle");
    const saved = read();
    let step = clampStep(saved.chordStep);

    function read() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {}; }
      catch (error) { return {}; }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ dark: isDark(), chordStep: step }));
      } catch (error) { /* private mode: this visit still works, it just won't be remembered */ }
    }

    const isDark = () => root.dataset.theme === "dark";
    /* `+null` is 0, and 0 is a real step — so a missing preference must be caught
       before the number coercion, or it silently means "smallest". */
    function clampStep(value) {
      const step = value === null || value === undefined || value === "" ? DEFAULT_STEP : Math.round(+value);
      if (!Number.isFinite(step)) return DEFAULT_STEP;
      return Math.max(0, Math.min(CHORD_SIZES.length - 1, step));
    }

    function showTheme() {
      const dark = isDark();
      themeButton.textContent = dark ? "☀️" : "🌙";
      themeButton.setAttribute("aria-pressed", String(dark));
      themeButton.title = dark ? "Daylight mode" : "Stage mode (dark)";
    }

    function showChordSize() {
      root.style.setProperty("--chords-size", CHORD_SIZES[step] + "px");
      root.style.setProperty("--chords-size-phone", PHONE_SIZES[step] + "px");
      document.getElementById("textSmaller").disabled = step === 0;
      document.getElementById("textBigger").disabled = step === CHORD_SIZES.length - 1;
    }

    function resize(by) { step = clampStep(step + by); showChordSize(); save(); }

    themeButton.addEventListener("click", () => {
      if (isDark()) delete root.dataset.theme; else root.dataset.theme = "dark";
      showTheme();
      save();
    });
    document.getElementById("textSmaller").addEventListener("click", () => resize(-1));
    document.getElementById("textBigger").addEventListener("click", () => resize(1));

    /* Follow the phone's own day/night switch until someone overrides it here. */
    const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if (system && !("dark" in saved)) {
      system.addEventListener("change", (e) => {
        if ("dark" in read()) return;                    // they've since chosen for themselves
        if (e.matches) root.dataset.theme = "dark"; else delete root.dataset.theme;
        showTheme();
      });
    }

    showTheme();
    showChordSize();
  })();

  /* ---------------- Opening explosion ---------------- */
  (function () {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const title = document.querySelector(".band-name");
    const rect = title
      ? title.getBoundingClientRect()
      : { left: window.innerWidth / 2, top: window.innerHeight / 3, width: 0, height: 0 };
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const colors = ["#4da2ff", "#a78bfa", "#f472b6", "#fbbf24", "#38bdf8", "#34d399", "#ffffff"];

    const layer = document.createElement("div");
    layer.id = "explosion";
    document.body.appendChild(layer);

    const N = 48;
    for (let i = 0; i < N; i++) {
      const p = document.createElement("span");
      p.className = "boom";
      const angle = (Math.PI * 2 * i) / N + (i % 3) * 0.16;
      const dist = 150 + ((i * 53) % 280);      // varied spread
      const size = 8 + ((i * 13) % 12);
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--ox", ox + "px");
      p.style.setProperty("--oy", oy + "px");
      p.style.setProperty("--tx", (Math.cos(angle) * dist) + "px");
      p.style.setProperty("--ty", (Math.sin(angle) * dist + dist * 0.15) + "px");
      p.style.setProperty("--dur", (0.9 + (i % 7) * 0.09).toFixed(2) + "s");
      layer.appendChild(p);
    }
    setTimeout(() => layer.remove(), 1900);
  })();
</script>
</body>
</html>
